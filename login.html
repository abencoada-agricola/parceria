<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acesso | Abençoada Agrícolas</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#edf3ec;color:#183e32;min-height:100vh;display:grid;place-items:center;padding:24px;border-top:7px solid #183e32}.card{width:100%;max-width:450px;background:white;padding:38px;border:1px solid #d4e1d3;border-radius:18px;box-shadow:0 15px 45px #183e3210}img{display:block;width:230px;max-width:100%;height:auto;margin:0 auto 30px}h1{font-size:27px;line-height:1.2;margin:0 0 12px}p{font-size:16px;line-height:1.6;color:#637468}label{display:block;font-weight:bold;font-size:15px;margin:20px 0 8px}input{width:100%;font-size:18px;padding:13px;border:1px solid #b4c7b7;border-radius:8px;color:#183e32}input:focus{outline:3px solid #cbe1d0;border-color:#287154}button{width:100%;border:0;background:#183e32;color:white;font-size:17px;font-weight:bold;border-radius:8px;padding:15px;margin-top:26px;cursor:pointer}button:hover{background:#287154}.note{font-size:13px;background:#f2f5ef;border-radius:8px;padding:12px;margin-top:24px}.error{color:#9e342b;font-size:14px;min-height:22px;margin-top:12px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.keypad button{margin:0;min-height:58px;padding:12px;font-size:24px;background:#edf3ec;color:#183e32;border:1px solid #d4e1d3;border-radius:10px;touch-action:manipulation}.keypad button:hover{background:#dbe9dc}.keypad button:active{background:#bdd8c4}.keypad .utility{font-size:14px}.keypad button:focus-visible{outline:3px solid #b88c41;outline-offset:2px}#password{letter-spacing:5px;font-size:24px;text-align:center}@media(max-width:450px){.card{padding:26px}.keypad button{min-height:62px}}.keypad [data-digit="0"]{grid-column:2}.keypad #backspace{grid-column:3}</style></head><body><main class="card"><img src="logo-abencoada.png" alt="Abençoada Agrícolas"><form id="login"><label for="username">Usuário</label><input id="username" autocomplete="username" required value="abençoada"><label for="password">Senha</label><input id="password" type="password" inputmode="numeric" autocomplete="current-password" required><div class="keypad" role="group" aria-label="Teclado numérico da senha"><button type="button" data-digit="1">1</button><button type="button" data-digit="2">2</button><button type="button" data-digit="3">3</button><button type="button" data-digit="4">4</button><button type="button" data-digit="5">5</button><button type="button" data-digit="6">6</button><button type="button" data-digit="7">7</button><button type="button" data-digit="8">8</button><button type="button" data-digit="9">9</button><button type="button" data-digit="0">0</button><button type="button" id="backspace" class="utility" aria-label="Apagar último número">Apagar</button></div><button type="submit">Entrar</button><div id="message" class="error" role="status"></div></form></main><script>const password=document.querySelector('#password');document.querySelectorAll('[data-digit]').forEach(button=>button.addEventListener('click',()=>{password.value+=button.dataset.digit;password.dispatchEvent(new Event('input',{bubbles:true}));}));document.querySelector('#backspace').addEventListener('click',()=>{password.value=password.value.slice(0,-1);});password.addEventListener('input',()=>{password.value=password.value.replace(/[^0-9]/g,'');});document.querySelector('#login').addEventListener('submit',e=>{e.preventDefault();const user=document.querySelector('#username').value.trim().toLocaleLowerCase('pt-BR');if(user==='abençoada'&&password.value==='1234'){sessionStorage.setItem('parceria-login','ok');location.replace('index.html');}else{document.querySelector('#message').textContent='Usuário ou senha incorretos.';password.value='';password.focus();}});</script></body></html>
